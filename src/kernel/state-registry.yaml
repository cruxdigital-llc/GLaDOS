# GLaDOS v2 State-Key Registry
#
# Every piece of shared state a workflow core or module may read or write is a
# FLAT TOKEN registered here, with exactly one declared home. Cores/modules
# declare `reads:` / `writes:` lists of these tokens in frontmatter; the
# compiler fails an install where any enabled `reads:` token has no enabled
# writer. Tokens are flat strings — no paths, no templates, no wildcards.
#
# `home:` values:
#   run-record   — inside the current run's record file (.glados/runs/…)
#   ledger       — the run ledger itself: .glados/runs/ in the working tree,
#                  saved to the glados/ledger branch (never a work branch)
#   manifest     — glados.yaml (lane-2 runtime read; writer is the human/MR)
#   repo:<path>  — a versioned repo file
#
# Keys with home: manifest list `writer: human` — the compiler treats them as
# always-written (the manifest schema requires them), so reading them never
# fails the check; WRITING them from a workflow is forbidden. A repo key may
# list `writer: human` too, when people write it: reading it then never fails
# the check either, and a workflow that also writes it declares the write
# (canon.digests, which steward refreshes).

keys:
  run.record:
    home: ledger
    doc: >
      The current run's record file, with its step artifacts beside it.
      Created by every core's compiled preamble in .glados/runs/, which the
      clone's git exclude file (every ledger command writes the line) keeps
      out of every branch's commits, and saved to the glados/ledger branch
      by `glados.py ledger save` at each commit point and in the compiled
      epilogue; `ledger restore` reads it back in another session.
  run.current:
    home: ledger
    doc: >
      The in-flight markers. .glados/runs/current holds the filename of the
      innermost run in flight (one line, so older hooks keep working);
      .glados/runs/stack lists every run in flight, one filename per line,
      outermost first, its last line equal to current. A run nested inside
      another (plan-feature inside build-feature) pushes onto the stack; a
      run is nested only when a workflow running in the same session started
      it, so any other leftover marker is stale and a fresh run replaces it.
      Written by every core's compiled preamble at run start; popped by the
      compiled epilogue's release step, which rewrites current to the
      enclosing run or deletes both files when the stack empties; read by the
      host-agent run-record guard hooks (.glados/hooks/), which check every
      listed record. Transient run state — never committed.
  run.active-personas:
    home: run-record
    doc: >
      Persona roster for review passes of this feature. Written by plan-feature;
      when absent, readers fall back to manifest key params.review-panel.personas.
  review.cycle:
    home: run-record
    doc: Review-loop cycle counter for the feature's MR. Written by review-mr epilogue.
  review.reviewed-head:
    home: run-record
    doc: >
      The MR HEAD SHA last reviewed. Written by review-mr epilogue; read by the
      re-review guard.
  review.verdicts:
    home: run-record
    doc: >
      The tallied per-persona verdict objects for the latest cycle, together
      with that cycle's root-cause synthesis - the underlying-cause reading of
      the change and any consolidated finding clusters. Written by review-mr;
      read by address-review.
  epic.progress:
    home: ledger
    doc: >
      The epic run record - ticket table (id | depends-on | holder | status),
      integration branch, operating rules. Written and updated by run-epic;
      read by run-epic on resume. build-feature reads the integration branch
      through epic.integration-branch, which lives inside this record.
  epic.integration-branch:
    home: run-record
    doc: >
      The integration branch child MRs target. Written by run-epic at epic
      init (inside epic.progress); read by build-feature. Outside an epic,
      readers fall back to manifest key branching.default-target.
  work.base-sha:
    home: run-record
    doc: >
      The base commit recorded at claim time. Written by any mutating core's
      preamble; read by the yield-on-external-edit rule in the epilogue.
  observations.pending:
    home: "repo:product-knowledge/observations/"
    doc: >
      Observed-standard / observed-philosophy candidates awaiting promotion,
      and canon conflicts (a canon principle a recorded decision, a standard
      or a philosophy overrides). Written by retrospect, review-codebase and
      brunch, and by the workflows that consult canon (plan-feature,
      spec-feature, verify-feature, run-pipeline); read and cleared (which
      is a write) by steward.
  canon.digests:
    home: "repo:product-knowledge/canon/"
    writer: human
    doc: >
      The canon digests: one file per entry under manifest key `canon`, at
      the entry's `digest:` path (conventionally
      product-knowledge/canon/<name>.md). Written by people from the
      CANON.md template, and refreshed by steward's canon step inside its
      cleanup MR; read at each consult point (plan-feature, spec-feature,
      verify-feature, review-mr, review-codebase, brunch, run-pipeline),
      whose fresh agents get the paths. Never compiled.
  standards.index:
    home: "repo:product-knowledge/standards/"
    doc: >
      The standards tree (and index) applied by the standards gate. Written by
      steward (promotions); read by standards-gate, mr-review-panel, and
      verify-feature (standards-stale audit).
  intent.mission:
    home: "repo:product-knowledge/MISSION.md"
    doc: Mission / product intent. Written by the intent core; read by plan-feature.
  intent.roadmap:
    home: "repo:product-knowledge/ROADMAP.md"
    doc: >
      The Now/Next/Later roadmap. Written by the intent core; read by
      plan-feature when framing a feature.
  intent.status:
    home: "repo:product-knowledge/PROJECT_STATUS.md"
    doc: >
      The schema'd project status file. Written by adopt-codebase (adoption
      metadata) and steward (documentation refresh); read by intent,
      plan-feature, build-feature, run-epic, review-codebase, retrospect.

  # ---- SDA conformance keys (active only when glados.yaml sets sda: true) --
  # Deliberately absent from every core/module frontmatter: their writers are
  # the compiled preamble/epilogue's conditional SDA steps, which exist in
  # every compile and no-op when the key is off — so declaring reads: on them
  # would fail the readers-without-writers check on non-SDA installs. The
  # reader relationships below are documentation, not compile edges.
  sda.claims:
    home: "repo:claims.md"
    doc: >
      The SDA claims file at the repo root (grammar: SDA standard v1.0,
      Claims; mapping: docs/standards/sda-profile-glados-v2.1.md). Written by
      the compiled preamble's claim step and cleared by the compiled epilogue
      when `sda: true` (by the outermost run only: nested runs work under
      the enclosing run's claim; a ticket's build inside run-epic is a unit
      of work of its own; review-mr and address-review, which act on
      another's merge request, claim nothing); read by run-epic for
      contention awareness and, externally, by Wheatley's claims overlay.
      Inert when `sda:` is absent or false.
  sda.spec-log:
    home: "repo:product-knowledge/SPEC_LOG.md"
    doc: >
      The SDA work-unit log — one appended row per unit of work (date,
      workflow, scope, outcome, links), newest first: the outermost run
      appends it, and runs nested inside it append none (a ticket's build
      inside run-epic is a unit of work of its own), nor do review-mr and
      address-review, which act on another's merge request. Written by the
      compiled epilogue when `sda: true`; consumed outside the compile graph
      by SDA tooling and audits.

  # ---- manifest keys (lane 2: runtime-read; writer is the human via MR) ----
  manifest.platform:
    home: manifest
    writer: human
    doc: >
      The project platform (gitlab | github). Cores that open MRs, file
      tickets, or query pipelines resolve it to pick the platform CLI.
  manifest.phase:
    home: manifest
    writer: human
    doc: Required project phase - nascent | evolving | production | sunset.
  manifest.channels:
    home: manifest
    writer: human
    doc: Outcome-type -> sink bindings. Read by every epilogue at publish time.
  manifest.decisions:
    home: manifest
    writer: human
    doc: Decision-rights keys (agent | record | escalate | forbidden).
  manifest.merge-authority:
    home: manifest
    writer: human
    doc: >
      Who may merge - human | agent-integration-only | agent. No workflow text
      may state a merge authority; all read this key.
  manifest.branching:
    home: manifest
    writer: human
    doc: Branch naming + default MR target conventions.
  manifest.panel-personas:
    home: manifest
    writer: human
    doc: >
      Default review-panel roster when run.active-personas is absent. Maps to
      the manifest key params.review-panel.personas in glados.yaml.
  manifest.pipelines:
    home: manifest
    writer: human
    doc: >
      The project's own workflows (glados.yaml `pipelines:`): per pipeline a
      description, a `when:` selection hint, the step sequence and per-step
      options. Read live by run-pipeline, which validates them before its
      first step. Only the names and descriptions shape compiled output (one
      shortcut command per pipeline in script installs), so only they are
      in the manifest hash. Explicit-only: no phase preset may set it.
  manifest.steps:
    home: manifest
    writer: human
    doc: >
      The project's own pipeline steps (glados.yaml `steps:`): description,
      kind (produce | gate | change), stage, and what each produces or
      audits. Each step's body lives at product-knowledge/steps/<id>.md with
      no frontmatter. Read live by run-pipeline. Explicit-only.
  manifest.canon:
    home: manifest
    writer: human
    doc: >
      The reference works the project holds as authoritative (glados.yaml
      `canon:`): per entry a citation, an optional URL, the repo-relative
      path of its digest (conventionally product-knowledge/canon/<name>.md),
      the consult points it applies to and the seats that apply it. Read
      live at each consult point, which reads the digest and never fetches
      the URL; steward's refresh step is the one reader that fetches.
      Nothing of it is compiled or hashed. Explicit-only.

# Outcome types (emitted through channels; a type emitted by an enabled core
# with zero sinks bound in manifest.channels is an install error):
outcome-types:
  - progress      # run summaries; always at least the ledger
  - verdict       # review/evaluator outcomes
  - escalation    # loop bounds hit, forbidden decisions, blockers
  - bug           # defects found outside the current change
  - decision      # record-class decisions (phase decision-rights 'record')
  - observation   # observed standards/philosophies, persona-calibration signals
