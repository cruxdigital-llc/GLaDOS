# GLaDOS drift + type check for GitLab CI.
#
# `glados.py install` vendors this file to `.glados/ci/` together with the full
# source tree (`.glados/src/`), so the vendored checker is self-contained — no
# --source needed. Enable it from your .gitlab-ci.yml:
#
#   include:
#     - local: '.glados/ci/glados-check.gitlab-ci.yml'
#
# It runs the vendored compiler in check mode: recompute the compile in-memory
# from the vendored sources + manifest, diff against the installed files, run
# every type check, and verify the vendored manifest hash. Drift, a failed
# check, or a stale compile fail the job. The job ships report-only first.
# To enforce (recommended when entering production), override its script in
# your .gitlab-ci.yml, below the include:
#
#   glados-check:
#     script:
#       - python .glados/glados.py check --target .
#
# Not by editing this file: every install vendors it again, --report-only
# included, and `check` does not report the difference.

glados-check:
  stage: test
  image: python:3.12-slim
  script:
    - python .glados/glados.py check --target . --report-only
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Universal run-record backstop: scans git history for silent-loss candidates,
# and on a merge request lists any run record the branch commits (records live
# on the glados/ledger branch, never in a merge request's diff; it compares
# with the merge request's diff base, CI_MERGE_REQUEST_DIFF_BASE_SHA).
# Report-only, and kept a separate, non-blocking job so its output is visible
# without ever gating a merge.
#
# python:3.12-slim ships no git binary. Without one, verify-ledger sees no
# history and reports "nothing to scan", so the job passed without scanning
# anything. Install git first, and mark the checkout safe: the runner may
# clone it as a different user, and git then refuses to read the repo. The
# glados-check job above reads only files, so it needs no git. The pipeline
# clones only the branch under test, so the job fetches the ledger branch,
# where the run records are, before scanning; a project with no ledger yet
# fetches nothing.
glados-verify-ledger:
  stage: test
  image: python:3.12-slim
  allow_failure: true
  variables:
    GIT_DEPTH: 0   # the scan needs real history, not a shallow clone
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch --no-tags origin "+refs/heads/glados/ledger:refs/remotes/origin/glados/ledger" || true
  script:
    - python .glados/glados.py verify-ledger --target . --report-only
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
